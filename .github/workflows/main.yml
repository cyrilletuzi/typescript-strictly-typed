name: CI

on: pull_request

permissions:
  contents: read

jobs:
  check:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline --ignore-scripts --allow-git=none --allow-remote=none --allow-file=none --allow-directory=none
      - name: Verify package signatures
        run: npm audit signatures
      - name: Lint and type check
        run: npm run check
